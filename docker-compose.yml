version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auralicense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - aura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auralicense"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/auralicense
      JWT_SECRET: ${JWT_SECRET:-aura_lifesciences_super_secure_jwt_secret_key_2026_gxp_part11}
      ENABLE_GXP_HASH_CHAIN: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aura-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - aura-network

volumes:
  aura_pgdata:
    driver: local

networks:
  aura-network:
    driver: bridge
